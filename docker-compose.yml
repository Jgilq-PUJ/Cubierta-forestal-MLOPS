# Cubierta Forestal MLOps · docker compose
#
#   s1 Data API (external, reached through VPN)  --->  s2 Airflow
#   s2 Airflow  <--->  s3 PostgreSQL              (raw + curated tables)
#   s3 PostgreSQL  --->  s4 Jupyter               (training reads from the DB)
#   s4 Jupyter  --->  s5 MinIO                    (publishes trained models)
#   s5 MinIO  --->  s6 Inference API              (loads the model to serve)
#
# Two isolated Postgres instances, each with its own volume:
#   - airflow-db : Airflow metadata only (internal, not published to the host)
#   - postgres   : business database written by the DAGs and read by Jupyter
#
# Jupyter and the Inference API are built from the same Dockerfile / uv.lock
# (targets `jupyter` and `api`) so the model serialised in training can be
# deserialised in serving with identical library versions.

name: cubierta-forestal

x-airflow-common: &airflow-common
  image: apache/airflow:${AIRFLOW_VERSION:-3.3.2}
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD:-airflow}@airflow-db:5432/${AIRFLOW_DB_NAME:-airflow}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-change-me-jwt-secret}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # s1 · external Data API, reached through the VPN of the host
    DATA_API_URL: ${DATA_API_URL:?set DATA_API_URL in .env}
    DATA_API_TOKEN: ${DATA_API_TOKEN:-}
    # s3 · project database the DAGs write into
    DATA_DB_HOST: postgres
    DATA_DB_PORT: "5432"
    DATA_DB_NAME: ${DATA_DB_NAME:-cubierta_forestal}
    DATA_DB_USER: ${DATA_DB_USER:-app}
    DATA_DB_PASSWORD: ${DATA_DB_PASSWORD:-app}
  volumes:
    - ./services/airflow/dags:/opt/airflow/dags
    - ./services/airflow/logs:/opt/airflow/logs
    - ./services/airflow/plugins:/opt/airflow/plugins
    - ./services/airflow/config:/opt/airflow/config
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-common-depends-on
    airflow-db:
      condition: service_healthy
    postgres:
      condition: service_healthy

services:
  # ------------------------------------------------------------------------- #
  # s3 · PostgreSQL (business database)
  # ------------------------------------------------------------------------- #
  postgres:
    image: postgres:16
    container_name: cf-postgres
    environment:
      POSTGRES_DB: ${DATA_DB_NAME:-cubierta_forestal}
      POSTGRES_USER: ${DATA_DB_USER:-app}
      POSTGRES_PASSWORD: ${DATA_DB_PASSWORD:-app}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Optional schema/seed .sql files, applied once on an empty volume
      - ./services/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DATA_DB_USER:-app}", "-d", "${DATA_DB_NAME:-cubierta_forestal}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # ------------------------------------------------------------------------- #
  # Airflow metadata database (internal to the stack, separate volume)
  # ------------------------------------------------------------------------- #
  airflow-db:
    image: postgres:16
    container_name: cf-airflow-db
    environment:
      POSTGRES_DB: ${AIRFLOW_DB_NAME:-airflow}
      POSTGRES_USER: ${AIRFLOW_DB_USER:-airflow}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow}
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${AIRFLOW_DB_USER:-airflow}", "-d", "${AIRFLOW_DB_NAME:-airflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # ------------------------------------------------------------------------- #
  # s2 · Airflow (LocalExecutor: api-server + scheduler + dag-processor + triggerer)
  # ------------------------------------------------------------------------- #
  airflow-init:
    <<: *airflow-common
    container_name: cf-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/{logs,dags,plugins,config}
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/{logs,dags,plugins,config}
        exec /entrypoint airflow version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-airflow}
    user: "0:0"

  airflow-apiserver:
    <<: *airflow-common
    container_name: cf-airflow-apiserver
    command: api-server
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: cf-airflow-scheduler
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    container_name: cf-airflow-dag-processor
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    container_name: cf-airflow-triggerer
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # ------------------------------------------------------------------------- #
  # s5 · MinIO (model registry / artifact store)
  # ------------------------------------------------------------------------- #
  minio:
    image: minio/minio:${MINIO_VERSION:-RELEASE.2025-04-22T22-12-26Z}
    container_name: cf-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # One-shot: creates the models bucket so Jupyter can publish on first run
  minio-init:
    image: minio/mc:${MC_VERSION:-RELEASE.2025-04-16T18-13-26Z}
    container_name: cf-minio-init
    entrypoint: /bin/sh
    command:
      - -c
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$MODELS_BUCKET"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MODELS_BUCKET: ${MODELS_BUCKET:-models}
    depends_on:
      minio:
        condition: service_healthy

  # ------------------------------------------------------------------------- #
  # s4 · Jupyter (training: reads Postgres, publishes models to MinIO)
  # ------------------------------------------------------------------------- #
  jupyter:
    build:
      context: .
      target: jupyter
    image: cubierta-forestal-jupyter:0.1.0
    container_name: cf-jupyter
    ports:
      - "${JUPYTER_PORT:-8888}:8888"
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-cubierta}
      DATA_DB_HOST: postgres
      DATA_DB_PORT: "5432"
      DATA_DB_NAME: ${DATA_DB_NAME:-cubierta_forestal}
      DATA_DB_USER: ${DATA_DB_USER:-app}
      DATA_DB_PASSWORD: ${DATA_DB_PASSWORD:-app}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MODELS_BUCKET: ${MODELS_BUCKET:-models}
    volumes:
      # Bind mounts to iterate without rebuilding the image
      - ./services/jupyter/notebooks:/workspace/notebooks
      - ./cubierta-forestal/src:/workspace/src
      - ./cubierta-forestal/pyproject.toml:/workspace/pyproject.toml
      - ./cubierta-forestal/uv.lock:/workspace/uv.lock
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ------------------------------------------------------------------------- #
  # s6 · Inference API (serves the model published in MinIO)
  # ------------------------------------------------------------------------- #
  inference-api:
    build:
      context: .
      target: api
    image: cubierta-forestal-api:0.1.0
    container_name: cf-inference-api
    ports:
      - "${INFERENCE_API_PORT:-8000}:8000"
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MODELS_BUCKET: ${MODELS_BUCKET:-models}
      MODEL_NAME: ${MODEL_NAME:-cubierta-forestal}
    depends_on:
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-data:
    name: cubierta_forestal_postgres
  airflow-db-data:
    name: cubierta_forestal_airflow_db
  minio-data:
    name: cubierta_forestal_minio
