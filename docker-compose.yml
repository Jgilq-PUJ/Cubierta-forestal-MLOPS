# Cubierta Forestal MLOps · docker compose
#
#   s1 Data API (external, reached through VPN)  --->  s2 Airflow
#   s2 Airflow  <--->  s3 PostgreSQL              (raw + curated tables)
#   s3 PostgreSQL  --->  s4 Jupyter               (training reads from the DB)
#   s4 Jupyter  --->  s5 MinIO                    (publishes trained models)
#   s5 MinIO  --->  s6 Inference API              (loads the model to serve)
#
# Two isolated Postgres instances, each with its own volume:
#   - airflow-db : Airflow metadata only (internal, not published to the host)
#   - postgres   : business database written by the DAGs and read by Jupyter
#
# Jupyter and the Inference API are built from the same Dockerfile / uv.lock
# (targets `jupyter` and `api`) so the model serialised in training can be
# deserialised in serving with identical library versions.

name: cubierta-forestal

x-airflow-common: &airflow-common
  image: apache/airflow:3.3.2
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: change-me-jwt-secret
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # s1 · external Data API, reached through the VPN of the host
    DATA_API_URL: http://data-api.example.internal
    DATA_API_TOKEN: ""
    # s3 · project database the DAGs write into
    DATA_DB_HOST: postgres
    DATA_DB_PORT: "5432"
    DATA_DB_NAME: cubierta_forestal
    DATA_DB_USER: app
    DATA_DB_PASSWORD: app
  volumes:
    - ./services/airflow/dags:/opt/airflow/dags
    - ./services/airflow/logs:/opt/airflow/logs
    - ./services/airflow/plugins:/opt/airflow/plugins
    - ./services/airflow/config:/opt/airflow/config
  user: "50000:0"
  depends_on: &airflow-common-depends-on
    airflow-db:
      condition: service_healthy
    postgres:
      condition: service_healthy

services:
  # ------------------------------------------------------------------------- #
  # s3 · PostgreSQL (business database)
  # ------------------------------------------------------------------------- #
  postgres:
    image: postgres:16
    container_name: cf-postgres
    environment:
      POSTGRES_DB: cubierta_forestal
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Optional schema/seed .sql files, applied once on an empty volume
      - ./services/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app", "-d", "cubierta_forestal"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # ------------------------------------------------------------------------- #
  # Airflow metadata database (internal to the stack, separate volume)
  # ------------------------------------------------------------------------- #
  airflow-db:
    image: postgres:16
    container_name: cf-airflow-db
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow", "-d", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # ------------------------------------------------------------------------- #
  # s2 · Airflow (LocalExecutor: api-server + scheduler + dag-processor + triggerer)
  # ------------------------------------------------------------------------- #
  airflow-init:
    <<: *airflow-common
    container_name: cf-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/{logs,dags,plugins,config}
        chown -R "50000:0" /opt/airflow/{logs,dags,plugins,config}
        exec /entrypoint airflow version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: airflow
      _AIRFLOW_WWW_USER_PASSWORD: airflow
    user: "0:0"

  airflow-apiserver:
    <<: *airflow-common
    container_name: cf-airflow-apiserver
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: cf-airflow-scheduler
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    container_name: cf-airflow-dag-processor
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    container_name: cf-airflow-triggerer
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # ------------------------------------------------------------------------- #
  # s5 · MinIO (model registry / artifact store)
  #
  # Official image from quay.io. If the pull fails with 401, the registry
  # requires authentication (MinIO removed its public images in 2026-09);
  # `bitnamilegacy/minio:2025.7.23-debian-12-r5` is a known pullable fallback
  # that stores data in /bitnami/minio/data instead of /data.
  # ------------------------------------------------------------------------- #
  minio:
    image: quay.io/minio/minio:latest
    container_name: cf-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # One-shot: the official image does not create buckets on start, so this
  # reuses the already-built api image (it ships the minio client) to create
  # the models bucket before Jupyter and the Inference API come up.
  minio-init:
    image: cubierta-forestal-api:0.1.0
    container_name: cf-minio-init
    entrypoint: ["python", "-c"]
    command:
      - |
        from minio import Minio
        client = Minio("minio:9000", "minioadmin", "minioadmin", secure=False)
        if not client.bucket_exists("models"):
            client.make_bucket("models")
        print("bucket ready: models")
    depends_on:
      minio:
        condition: service_healthy

  # ------------------------------------------------------------------------- #
  # s4 · Jupyter (training: reads Postgres, publishes models to MinIO)
  # ------------------------------------------------------------------------- #
  jupyter:
    build:
      context: .
      target: jupyter
    image: cubierta-forestal-jupyter:0.1.0
    container_name: cf-jupyter
    ports:
      - "8888:8888"
    environment:
      JUPYTER_TOKEN: cubierta
      DATA_DB_HOST: postgres
      DATA_DB_PORT: "5432"
      DATA_DB_NAME: cubierta_forestal
      DATA_DB_USER: app
      DATA_DB_PASSWORD: app
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MODELS_BUCKET: models
    volumes:
      # Bind mounts to iterate without rebuilding the image
      - ./services/jupyter/notebooks:/workspace/notebooks
      - ./cubierta-forestal/src:/workspace/src
      - ./cubierta-forestal/pyproject.toml:/workspace/pyproject.toml
      - ./cubierta-forestal/uv.lock:/workspace/uv.lock
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ------------------------------------------------------------------------- #
  # s6 · Inference API (serves the model published in MinIO)
  # ------------------------------------------------------------------------- #
  inference-api:
    build:
      context: .
      target: api
    image: cubierta-forestal-api:0.1.0
    container_name: cf-inference-api
    ports:
      - "8000:8000"
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MODELS_BUCKET: models
      MODEL_NAME: cubierta-forestal
    depends_on:
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-data:
    name: cubierta_forestal_postgres
  airflow-db-data:
    name: cubierta_forestal_airflow_db
  minio-data:
    name: cubierta_forestal_minio
